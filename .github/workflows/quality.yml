name: candidate-quality

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: candidate-quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  candidate-scope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Require supported same-repository scope
        env:
          QUALITY_SCOPE_ALLOWED: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: node scripts/run-quality-ci.mjs --phase scope

  gates:
    needs: candidate-scope
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            phase: quality
          - os: windows-latest
            phase: archives
    runs-on: ${{ matrix.os }}
    env:
      QUALITY_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      QUALITY_CANDIDATE: ${{ github.workspace }}/candidate-input.json
    defaults:
      run:
        working-directory: candidate/dsh-agent-manage
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          path: candidate/dsh-agent-manage
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Require explicit read-only peer credential
        env:
          PEER_READ_TOKEN: ${{ secrets.PLUGIN_SPLIT_READ_TOKEN }}
        run: |
          node -e "if (!process.env.PEER_READ_TOKEN) throw Error('CANDIDATE_PEER_REQUIRED: configure a contents-read token for both private peer repositories')"
      - uses: actions/checkout@v7
        with:
          repository: CleverC2200/dsh-agent-workbench
          ref: 9b4863692cb29a3edc8a2358e98feb7846526d1b
          fetch-depth: 0
          path: candidate/dsh-agent-workbench
          token: ${{ secrets.PLUGIN_SPLIT_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: CleverC2200/dsh-gea-plugin
          ref: b05ca162e1bf5ffb8443962a0b8b7e8ff8a61e96
          fetch-depth: 0
          path: candidate/dsh-gea-plugin
          token: ${{ secrets.PLUGIN_SPLIT_READ_TOKEN }}
          persist-credentials: false
      - name: Enable declared package managers
        run: corepack enable
      - name: Bind actual event commit and admitted peers
        run: node scripts/write-ci-input.mjs --root "${{ github.workspace }}" --sha "${{ env.QUALITY_EXPECTED_SHA }}"
      - name: Prepare independent SDK and run the same local gates
        id: gates
        run: node scripts/run-quality-ci.mjs --phase ${{ matrix.phase }} --prepare-sdk --core-source https://github.com/deepseek-ai/deepseek-harness.git
      - name: Audit known dependency vulnerabilities
        if: always() && matrix.phase == 'quality' && steps.gates.outputs.dependencies-prepared == 'true'
        run: node scripts/run-quality-ci.mjs --phase audit > "${{ github.workspace }}/dependency-audit.raw.log" 2>&1
      - name: Keep audit result including failure
        if: always() && matrix.phase == 'quality'
        uses: actions/upload-artifact@v7
        with:
          name: dependency-audit
          path: dependency-audit.raw.log
          if-no-files-found: warn

  candidate-quality:
    if: always()
    needs: [candidate-scope, gates]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Reject failure, cancellation, missing or skipped gates
        env:
          QUALITY_SCOPE_RESULT: ${{ needs.candidate-scope.result }}
          QUALITY_GATE_RESULT: ${{ needs.gates.result }}
          QUALITY_WINDOWS_RESULT: ${{ needs.gates.result }}
          QUALITY_AUDIT_RESULT: ${{ needs.gates.result }}
        run: node scripts/run-quality-ci.mjs --phase final
