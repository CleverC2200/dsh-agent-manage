name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '30 2 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      - name: Analyze code
        id: analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{ matrix.language }}'
          # Private isolated repos may lack Code scanning. Keep queries and SARIF.
          # Set CODE_SCANNING_UPLOAD=true after enabling the repository feature.
          upload: ${{ (!github.event.repository.private || vars.CODE_SCANNING_UPLOAD == 'true') && 'always' || 'never' }}

      - name: Preserve CodeQL results
        uses: actions/upload-artifact@v6
        with:
          name: codeql-${{ matrix.language }}-${{ github.sha }}
          path: ${{ steps.analyze.outputs.sarif-output }}
          if-no-files-found: error
