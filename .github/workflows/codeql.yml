name: CodeQL coverage unavailable

# Current private repository has no enabled code-scanning service. This
# workflow records that gap; it is not a successful analysis or upload.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  not-covered:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo 'CODEQL_NOT_COVERED: code scanning upload is unavailable for this private repository; see docs/clean-ci.md and the original failure receipt'
          exit 1
