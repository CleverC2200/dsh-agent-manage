name: CodeQL

on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
  schedule:
    - cron: '30 2 * * 1'

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.event_name == 'schedule' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      - name: Analyze code
        id: analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{ matrix.language }}'
          # Private isolated repos may lack Code scanning. Keep queries and SARIF.
          # Set CODE_SCANNING_UPLOAD=true after enabling the repository feature.
          upload: ${{ (!github.event.repository.private || vars.CODE_SCANNING_UPLOAD == 'true') && 'always' || 'never' }}

      - name: Preserve CodeQL results
        uses: actions/upload-artifact@v6
        with:
          name: codeql-${{ matrix.language }}-${{ github.sha }}
          path: ${{ steps.analyze.outputs.sarif-output }}
          if-no-files-found: error
